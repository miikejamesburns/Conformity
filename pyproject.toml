[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conformity"
version = "0.1.0"
description = "Post-production pipeline management system"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "opentimelineio>=0.16.0",
    # Note: PyOpenColorIO is optional - install via requirements-full.txt for color management
    # Package name is 'opencolorio' on PyPI (imports as 'PyOpenColorIO')
    "PyQt6>=6.6.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
]
full = [
    "opencolorio>=2.3.0",
    "av>=10.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
conformity = "conformity.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/conformity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
