[pytest]
# Pytest configuration for Conformity

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Command line options to apply by default
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Capture output
    --capture=no
    # Show summary of all test outcomes
    -ra
    # Run tests in parallel (requires pytest-xdist)
    # -n auto
    # Coverage options (requires pytest-cov)
    --cov=src/conformity
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Strict markers
    --strict-markers
    # Show warnings
    -W default

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests between modules
    e2e: End-to-end tests with full workflows
    slow: Tests that take significant time to run
    gui: Tests requiring GUI/display
    demo: Demo mode tests
    smoke: Quick smoke tests for basic functionality

# Minimum Python version
minversion = 3.11

# Log settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
[coverage:run]
source = src/conformity
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
